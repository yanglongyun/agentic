name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1 }
      - run: npm ci && npm run format:check && npm run check && npm test
      - run: npm ci --prefix ui && npm run ui:build && git diff --exit-code -- ui/dist
      - name: Version must match release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'if ("v" + require("./package.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1 }
      - run: npm ci --omit=dev
      - run: npm ci --prefix ui && npm run ui:build
      - run: npm run release:pack -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent_${{ matrix.platform }}_${{ matrix.arch }}
          path: |
            server/dist/agent_*.tar.gz
            server/dist/agent_*.zip
            server/dist/agent_*.sha256
  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: amd64 }
          - { os: macos-latest, platform: darwin, arch: arm64 }
          - { os: windows-latest, platform: windows, arch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1 }
      - uses: actions/download-artifact@v4
        with:
          name: agent_${{ matrix.platform }}_${{ matrix.arch }}
          path: server/dist
      - run: node server/scripts/smoke-install.js
      - if: runner.os == 'Linux'
        run: sh server/scripts/smoke-systemd.sh
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cat dist/*.sha256 > dist/checksums.txt
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*", generate_release_notes: true }

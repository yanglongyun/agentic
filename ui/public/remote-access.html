<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agentic · 远程访问</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f5f8;
        color: #171b25;
        font:
          15px/1.8 system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 480px;
        padding: 36px;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        background: white;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 650;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #2563eb;
        color: white;
      }
      h1 {
        margin: 28px 0 12px;
        font-size: 24px;
      }
      p {
        color: #626977;
      }
      ol {
        padding-left: 22px;
      }
      li {
        margin: 10px 0;
      }
      footer {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #eef0f3;
        color: #626977;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true">›_</span>agentic</div>
      <h1>从另一台设备继续对话</h1>
      <p>请使用客户端生成的完整访问链接打开对话。</p>
      <ol>
        <li>在电脑上的 agentic 中打开一个对话。</li>
        <li>点击右上角的链接图标，开启远程访问。</li>
        <li>复制访问链接，在这台设备上打开。</li>
      </ol>
      <footer>使用期间，请保持电脑上的 agentic 运行并联网。</footer>
    </main>
  </body>
</html>

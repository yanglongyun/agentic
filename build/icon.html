<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}html,body{width:1024px;height:1024px;background:transparent;overflow:hidden}
svg{display:block}
</style></head><body>
<!-- agentic 的应用图标:和界面左上角的 Mark 同一个图形,按 macOS 图标网格留出外边距(824px 圆角方块居中)。
     出图:Chrome 无头截图 → icon.png(1024),再用 iconutil 生成 icon.icns;插件图标从 icon.png 缩。 -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c70f8"/><stop offset="0.48" stop-color="#5a5ff5"/><stop offset="1" stop-color="#7b5cf0"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#g)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#s)"/>
  <g transform="translate(100 100) scale(25.75)">
    <path d="m11 11 5.4 5-5.4 5M18.6 21.4h4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg></body></html>
